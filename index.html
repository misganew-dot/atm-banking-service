<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ATM Banking Service</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- Main Menu -->
        <div id="menu-page" class="page active">
            <h2>ATM Banking Service</h2>
            <div class="atm-badge">24/7 Self-Service ATM Terminal</div>

            <div class="menu-box">
                <div class="link-btn" onclick="showPage('deposit-page')">Deposit Money</div>
                <div class="link-btn" onclick="showPage('withdraw-page')" style="background: red;">Withdraw Money</div>
                <div class="link-btn" onclick="showPage('transfer-page')" style="background: orange; color: black;">Transfer Money</div>
                <div class="link-btn" onclick="showPage('accounts-page')" style="background: #0a3d91;">Account Balances</div>
                <div class="link-btn" onclick="showPage('history-page')" style="background: #2b6cb0;">Transaction History</div>
            </div>

            <button class="reset-btn" onclick="resetBankData()">Reset All Accounts & History</button>
        </div>

        <!-- Deposit Page -->
        <div id="deposit-page" class="page">
            <h2>ATM Deposit Form</h2>
            <div class="form-group">
                <label>First Name</label>
                <input type="text" id="d-fname" required>
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" id="d-lname" required>
            </div>
            <div class="form-group">
                <label>Account Number (13 digits)</label>
                <input type="text" id="d-acc" maxlength="13" required>
            </div>
            <div class="form-group">
                <label>4-Digit PIN (Set or Verify)</label>
                <input type="password" id="d-pin" maxlength="4" placeholder="e.g. 1234" required>
            </div>
            <div class="form-group">
                <label>Amount (ETB)</label>
                <input type="number" id="d-amt" min="1" max="5000000" required>
                <div class="quick-amounts">
                    <button type="button" class="quick-btn" onclick="setQuickAmount('d-amt', 100)">100 ETB</button>
                    <button type="button" class="quick-btn" onclick="setQuickAmount('d-amt', 500)">500 ETB</button>
                    <button type="button" class="quick-btn" onclick="setQuickAmount('d-amt', 1000)">1,000 ETB</button>
                    <button type="button" class="quick-btn" onclick="setQuickAmount('d-amt', 5000)">5,000 ETB</button>
                </div>
            </div>
            <div class="form-group">
                <label>Signature</label>
                <input type="text" id="d-sig" required>
            </div>
            <div class="actions">
                <button class="back-btn" onclick="showPage('menu-page')">Back</button>
                <button class="submit-btn" onclick="validateForm('deposit')">Submit Deposit</button>
            </div>
        </div>

        <!-- Withdraw Page -->
        <div id="withdraw-page" class="page">
            <h2>ATM Withdraw Form</h2>
            <div class="form-group">
                <label>First Name</label>
                <input type="text" id="w-fname" required>
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" id="w-lname" required>
            </div>
            <div class="form-group">
                <label>Account Number (13 digits)</label>
                <input type="text" id="w-acc" maxlength="13" required>
            </div>
            <div class="form-group">
                <label>4-Digit PIN</label>
                <input type="password" id="w-pin" maxlength="4" placeholder="Enter 4-digit PIN" required>
            </div>
            <div class="form-group">
                <label>Amount (ETB)</label>
                <input type="number" id="w-amt" min="1" max="5000000" required>
                <div class="quick-amounts">
                    <button type="button" class="quick-btn" onclick="setQuickAmount('w-amt', 100)">100 ETB</button>
                    <button type="button" class="quick-btn" onclick="setQuickAmount('w-amt', 500)">500 ETB</button>
                    <button type="button" class="quick-btn" onclick="setQuickAmount('w-amt', 1000)">1,000 ETB</button>
                    <button type="button" class="quick-btn" onclick="setQuickAmount('w-amt', 5000)">5,000 ETB</button>
                </div>
            </div>
            <div class="form-group">
                <label>Signature</label>
                <input type="text" id="w-sig" required>
            </div>
            <div class="actions">
                <button class="back-btn" onclick="showPage('menu-page')">Back</button>
                <button class="submit-btn" style="background: red;" onclick="validateForm('withdraw')">Submit Withdrawal</button>
            </div>
        </div>

        <!-- Transfer Page -->
        <div id="transfer-page" class="page">
            <h2>ATM Transfer Form</h2>
            <div class="form-group">
                <label>Sender First Name</label>
                <input type="text" id="t-fname" required>
            </div>
            <div class="form-group">
                <label>Sender Last Name</label>
                <input type="text" id="t-lname" required>
            </div>
            <div class="form-group">
                <label>Sender Account Number (13 digits)</label>
                <input type="text" id="t-acc" maxlength="13" required>
            </div>
            <div class="form-group">
                <label>Sender 4-Digit PIN</label>
                <input type="password" id="t-pin" maxlength="4" placeholder="Enter 4-digit PIN" required>
            </div>

            <div class="form-group">
                <label>Receiver First Name</label>
                <input type="text" id="t-rfname" required>
            </div>
            <div class="form-group">
                <label>Receiver Last Name</label>
                <input type="text" id="t-rlname" required>
            </div>
            <div class="form-group">
                <label>Receiver Account Number (13 digits)</label>
                <input type="text" id="t-racc" maxlength="13" required>
            </div>

            <div class="form-group">
                <label>Amount (ETB)</label>
                <input type="number" id="t-amt" min="1" max="5000000" required>
                <div class="quick-amounts">
                    <button type="button" class="quick-btn" onclick="setQuickAmount('t-amt', 100)">100 ETB</button>
                    <button type="button" class="quick-btn" onclick="setQuickAmount('t-amt', 500)">500 ETB</button>
                    <button type="button" class="quick-btn" onclick="setQuickAmount('t-amt', 1000)">1,000 ETB</button>
                    <button type="button" class="quick-btn" onclick="setQuickAmount('t-amt', 5000)">5,000 ETB</button>
                </div>
            </div>
            <div class="actions">
                <button class="back-btn" onclick="showPage('menu-page')">Back</button>
                <button class="submit-btn" style="background: orange; color: black;" onclick="validateTransfer()">Submit Transfer</button>
            </div>
        </div>

        <!-- Accounts Balance Page -->
        <div id="accounts-page" class="page">
            <h2>Account Balances</h2>
            <div id="accounts-list" class="list-box"></div>
            <div class="actions">
                <button class="back-btn" onclick="showPage('menu-page')">Back to Menu</button>
            </div>
        </div>

        <!-- Transaction History Page -->
        <div id="history-page" class="page">
            <h2>Transaction History</h2>
            <div class="filter-bar">
                <input type="text" id="history-filter" maxlength="13" placeholder="Filter by 13-digit Account Number..." oninput="renderHistory()">
                <button type="button" class="clear-filter-btn" onclick="clearHistoryFilter()">Clear</button>
            </div>
            <div id="history-list" class="list-box"></div>
            <div class="actions">
                <button class="back-btn" onclick="showPage('menu-page')">Back to Menu</button>
            </div>
        </div>

        <div id="receipt"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
